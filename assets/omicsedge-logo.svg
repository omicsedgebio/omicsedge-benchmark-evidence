<svg xmlns="http://www.w3.org/2000/svg"
     width="760"
     height="180"
     viewBox="0 0 760 180"
     role="img"
     aria-labelledby="title desc">

  <title id="title">OmicsEdgeBio</title>
  <desc id="desc">
    OmicsEdgeBio logo with a stylized genomic evidence helix.
  </desc>

  <defs>
    <linearGradient id="edgeGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Genomic mark -->
  <g transform="translate(38 24)"
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round">

    <path d="
      M20 10
      C100 38, 20 92, 100 120
    "
      stroke="url(#edgeGradient)"
      stroke-width="10"/>

    <path d="
      M100 10
      C20 38, 100 92, 20 120
    "
      stroke="url(#edgeGradient)"
      stroke-width="10"/>

    <line x1="43" y1="27" x2="77" y2="27"
          stroke="#64748B" stroke-width="5"/>

    <line x1="31" y1="52" x2="89" y2="52"
          stroke="#64748B" stroke-width="5"/>

    <line x1="31" y1="78" x2="89" y2="78"
          stroke="#64748B" stroke-width="5"/>

    <line x1="43" y1="103" x2="77" y2="103"
          stroke="#64748B" stroke-width="5"/>

    <!-- Evidence nodes -->
    <circle cx="20" cy="10" r="6"
            fill="#4F46E5" stroke="none"/>

    <circle cx="100" cy="10" r="6"
            fill="#0891B2" stroke="none"/>

    <circle cx="20" cy="120" r="6"
            fill="#059669" stroke="none"/>

    <circle cx="100" cy="120" r="6"
            fill="#0891B2" stroke="none"/>
  </g>

  <!-- Wordmark -->
  <g font-family="-apple-system,
                  BlinkMacSystemFont,
                  'Segoe UI',
                  Helvetica,
                  Arial,
                  sans-serif">

    <text x="180"
          y="87"
          font-size="56"
          font-weight="700"
          fill="#0F172A">
      OmicsEdge
    </text>

    <text x="465"
          y="87"
          font-size="56"
          font-weight="700"
          fill="url(#edgeGradient)">
      Bio
    </text>

    <text x="183"
          y="122"
          font-size="19"
          font-weight="500"
          letter-spacing="3"
          fill="#64748B">
      BENCHMARK EVIDENCE REGISTRY
    </text>

    <text x="183"
          y="151"
          font-size="15"
          fill="#94A3B8">
      Evidence first · Provenance preserved
    </text>

  </g>
</svg>
