[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omicsedge-benchmark-evidence"
version = "0.1.0"
description = "Schema and provenance bootstrap for the Project 003 Benchmark Evidence Registry"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

